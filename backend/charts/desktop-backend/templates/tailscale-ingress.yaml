{{- if .Values.tailscale.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "desktop-backend.fullname" . }}-ts
  labels:
    {{- include "desktop-backend.labels" . | nindent 4 }}
  {{- with .Values.tailscale.proxyGroup }}
  annotations:
    tailscale.com/proxy-group: {{ . }}
  {{- end }}
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "desktop-backend.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ .Values.tailscale.hostname }}
      secretName: {{ include "desktop-backend.fullname" . }}-ts-tls
{{- end }}
