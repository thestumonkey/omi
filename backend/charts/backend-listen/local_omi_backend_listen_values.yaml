# Default values for backend-listen.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: 192.168.1.42:32000/backend-listen
  tag: "local"
  pullPolicy: Always

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: "omi-backend"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
# Admits the pod through the chakra-sacral NetworkPolicy to the self-hosted LLM
# (was only set by hand on the live Deployment).
podLabels:
  access-gpu: "true"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080
  annotations: {}
# [fork-only] Plain-HTTP tailnet address for the iOS app's sign-in
# (templates/tailscale-http-service.yaml).
tailscaleHttp:
  enabled: true
  hostname: omi-auth
# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

env:
  # ── Config (non-sensitive) ── from ConfigMap omi-backend-config ──────────
  - name: BASE_API_URL
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: BASE_API_URL
  - name: CASDOOR_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: CASDOOR_ENDPOINT
  - name: CASDOOR_INTERNAL_URL
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: CASDOOR_INTERNAL_URL
  - name: CASDOOR_ORG_NAME
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: CASDOOR_ORG_NAME
  - name: CASDOOR_APP_NAME
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: CASDOOR_APP_NAME
  - name: CASDOOR_CLIENT_ID
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: CASDOOR_CLIENT_ID
  - name: REDIS_DB_HOST
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: REDIS_DB_HOST
  - name: REDIS_DB_PORT
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: REDIS_DB_PORT
  - name: MONGODB_DB
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: MONGODB_DB
  - name: TYPESENSE_HOST
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: TYPESENSE_HOST
  - name: TYPESENSE_HOST_PORT
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: TYPESENSE_HOST_PORT
  # Typesense runs in-cluster over plain http (charts/typesense); the client defaults to https.
  - name: TYPESENSE_PROTOCOL
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: TYPESENSE_PROTOCOL
        optional: true
  # HOSTED_PUSHER_API_URL: not set — backend uses local processing fallback
  # [fork-only] CPU diarizer (charts/diarizer/local_omi_diarizer_values.yaml).
  - name: HOSTED_SPEAKER_EMBEDDING_API_URL
    value: http://diarizer.omi:8080
  - name: HOSTED_VAD_API_URL
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: HOSTED_VAD_API_URL
  - name: HOSTED_SPEECH_PROFILE_API_URL
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: HOSTED_SPEECH_PROFILE_API_URL
  - name: PINECONE_INDEX_NAME
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: PINECONE_INDEX_NAME
  - name: ENABLE_TRANSLATION
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: ENABLE_TRANSLATION
  - name: DEEPGRAM_SELF_HOSTED_ENABLED
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: DEEPGRAM_SELF_HOSTED_ENABLED
  - name: NO_SOCKET_TIMEOUT
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: NO_SOCKET_TIMEOUT

  # ── Secrets ── from Secret dev-omi-backend-secrets ───────────────────────
  - name: DEEPGRAM_API_KEY
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: DEEPGRAM_API_KEY
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: OPENAI_API_KEY
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: GITHUB_TOKEN
  - name: BUCKET_SPEECH_PROFILES
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: BUCKET_SPEECH_PROFILES
  - name: BUCKET_PLUGINS_LOGOS
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: BUCKET_PLUGINS_LOGOS
  - name: BUCKET_POSTPROCESSING
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: BUCKET_POSTPROCESSING
  # [fork-only] Buckets upstream reads from env with no default; storage.py
  # crashes on None. Created by charts/minio (local_omi_minio_values.yaml).
  # [fork-only] Build playback artifacts (merged MP3 + spans) in-process
  # instead of Cloud Tasks (utils/cloud_tasks.py tail). Needed to start
  # playback at a tapped transcript line.
  - name: AUDIO_MERGE_DISPATCH_MODE
    value: local
  - name: BUCKET_TEMPORAL_SYNC_LOCAL
    value: omi-chakra-sync-temp
  - name: BUCKET_CHAT_FILES
    value: omi-chakra-chat-files
  - name: BUCKET_APP_THUMBNAILS
    value: omi-chakra-app-thumbnails
  - name: BUCKET_SCREEN_FRAMES
    value: omi-chakra-screen-frames
  - name: BUCKET_DESKTOP_UPDATES
    value: omi-chakra-desktop-updates
  - name: PINECONE_API_KEY
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: PINECONE_API_KEY
  - name: REDIS_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: REDIS_DB_PASSWORD
  - name: ADMIN_KEY
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: ADMIN_KEY
  - name: WORKFLOW_API_KEY
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: WORKFLOW_API_KEY
  # --- S3/MinIO storage (replaces GCS) ---
  - name: S3_ENDPOINT_URL
    value: "http://omi-minio:9000"
  # [fork-only] Presigned links (audio playback) must open on phones: sign
  # them for MinIO's tailnet address (charts/minio tailscale-ingress).
  - name: S3_PRESIGN_ENDPOINT_URL
    value: "https://omi-files.spangled-kettle.ts.net"
  - name: S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: S3_ACCESS_KEY_ID
  - name: S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: S3_SECRET_ACCESS_KEY
  - name: ENCRYPTION_SECRET
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: ENCRYPTION_SECRET
  - name: HUGGINGFACE_TOKEN
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: HUGGINGFACE_TOKEN
  - name: TYPESENSE_API_KEY
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: TYPESENSE_API_KEY
  - name: MONGODB_URL
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: MONGODB_URL
  - name: CASDOOR_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: CASDOOR_CLIENT_SECRET
  # --- Self-hosted mode ---
  # No Omi-side metering: paywall, chat quota and credit gates return unlimited.
  - name: SELF_HOSTED
    value: "true"
  # Upstream's canonical memory intake; the pusher refuses to start without it.
  - name: MEMORY_ENABLED
    value: "on"
  - name: MEMORY_V3_CURSOR_SECRET
    valueFrom:
      secretKeyRef:
        name: dev-omi-backend-secrets
        key: MEMORY_V3_CURSOR_SECRET
  # Pusher subservice (deployed from the same image; see pusher Deployment).
  - name: HOSTED_PUSHER_API_URL
    value: "http://pusher.omi:8080"
  # Upstream's default streaming chain lists soniox, which fails startup
  # without SONIOX_API_KEY. Serve from Deepgram (cloud or self-hosted, per
  # DEEPGRAM_SELF_HOSTED_ENABLED) instead.
  - name: STT_SERVICE_MODELS
    value: "dg-nova-3"
  # Default LLM clients route here (utils/llm/selfhosted.py). Optional so a
  # missing key falls back to the cloud providers instead of blocking the pod.
  - name: SELF_HOSTED_LLM_URL
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: SELF_HOSTED_LLM_URL
        optional: true
  - name: SELF_HOSTED_LLM_MODEL
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: SELF_HOSTED_LLM_MODEL
        optional: true
  - name: SELF_HOSTED_LLM_MAX_CONCURRENCY
    valueFrom:
      configMapKeyRef:
        name: omi-backend-config
        key: SELF_HOSTED_LLM_MAX_CONCURRENCY
        optional: true
  # Embeddings from the local embedding server and memory-search vectors in
  # the cluster's Typesense, instead of OpenAI and Pinecone.
  - name: SELF_HOSTED_EMBED_URL
    value: "http://ollama-embed.omi:11434/v1"
  - name: SELF_HOSTED_EMBED_MODEL
    value: "nomic-embed-text"
  - name: SELF_HOSTED_VECTOR_STORE
    value: "typesense"
  # - name: GOOGLE_CLOUD_PROJECT_KEY
  #   valueFrom:
